[project]
name = "proxyscope"
version = "0.1.0"
description = "Interactive HTTP/HTTPS debugging proxy with runtime policies and terminal UI."
authors = [
    { name = "Tim Seyschab", email = "tim@shellnuts.de" }
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<4.0"
keywords = ["proxy", "http", "https", "mitm", "tui", "debugging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Software Development :: Testing",
    "Environment :: Console :: Curses",
]
dependencies = [
    "requests>=2.32.0,<3.0.0"
]

[project.scripts]
proxyscope = "proxyscope.app.main:main"

[tool.poetry]
packages = [{ include = "proxyscope" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
