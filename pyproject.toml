[project]
name = "proxyscope"
version = "0.2.0"
description = "Interactive HTTP/HTTPS debugging proxy with runtime policies and terminal UI."
authors = [
    { name = "Tim Seyschab", email = "tim@shellnuts.de" }
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<4.0"
keywords = ["proxy", "http", "https", "mitm", "tui", "debugging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Software Development :: Testing",
    "Environment :: Console :: Curses",
]
dependencies = [
    "requests>=2.32.0,<3.0.0",
    "textual (>=8.1.1,<9.0.0)"
]

[project.urls]
'Homepage' = 'https://pypi.org/project/proxyscope/'
'Repository' = 'https://github.com/TimSeyschab/proxyscope'
'Issue Tracker' = 'https://github.com/TimSeyschab/proxyscope/issues'

[project.scripts]
proxyscope = "proxyscope.app.main:main"

[tool.poetry]
packages = [{ include = "proxyscope" }]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.16,<0.16.0)",
    "pyright (>=1.1.410,<2.0.0)",
    "coverage (>=7.14.1,<8.0.0)"
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = ["proxyscope"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
reportMissingImports = false
reportMissingModuleSource = false

[tool.coverage.run]
source = ["proxyscope"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true
